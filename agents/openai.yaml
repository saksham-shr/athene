# OpenAI-platform packaging for Athene's skills.
# Mirrors the skill set in skills/ (and .agents/skills/, .claude/skills/) - same six skills,
# same invocation rules, described here in OpenAI's agent-config shape.
skills:
  - id: athene
    display_name: Athene
    description: >-
      Establish a repo's operating model, then build - lifecycle, ownership, CI/CD, stack
      decisions, governance.
    invocation:
      mode: implicit
      use_when: starting a new build
      skip_when: >-
        no Athene footprint exists yet (hands off to Athene: Audit instead), or for a one-off
        coding task with no process implications
    required_tools: [read_file, write_file, edit_file, grep, glob, shell]

  - id: athene-audit
    display_name: "Athene: Audit"
    description: >-
      Adopt Athene onto a repo never set up with it - scan structure, policies, CI, and ownership
      signals, write fixed-baseline governance docs, and bootstrap .athene/state.md.
    invocation:
      mode: implicit
      use_when: a repo has no .athene/state.md yet
      skip_when: .athene/state.md already exists (use Athene: Resume instead)
    required_tools: [read_file, write_file, edit_file, grep, glob, shell]

  - id: athene-code-health
    display_name: "Athene: Code Health"
    description: >-
      Rank a repo's code quality - bugs, security holes, scale limits, missing tests, slow paths,
      bloat. One-shot report, changes nothing.
    invocation:
      mode: implicit
      use_when: '"audit this codebase", "review the whole repo"'
      skip_when: >-
        process/governance setup (use Athene: Audit instead) or a single-file/diff review
    required_tools: [read_file, grep, glob, shell]

  - id: athene-launch
    display_name: "Athene: Launch"
    description: >-
      Prepare a product or feature for an early, evidence-seeking launch: cut scope to the
      smallest learning release, validate the riskiest assumptions, define release readiness, and
      run the post-launch review.
    invocation:
      mode: implicit
      use_when: >-
        the user is preparing to launch, validate, beta-test, announce, or market a
        product/feature
      skip_when: null
    required_tools: [read_file, write_file, edit_file, grep, glob, shell]

  - id: athene-product-discovery
    display_name: "Athene: Product Discovery"
    description: >-
      Turn an ambiguous product idea or feature request into an approved product brief - problem,
      user, outcome, scope, validation plan - then hand off to the Athene build skill.
    invocation:
      mode: implicit
      use_when: the desired outcome or tradeoffs are materially unclear, before building
      skip_when: >-
        a precise, low-risk task that can be done directly, or an already-approved specification
    required_tools: [read_file, write_file, edit_file, grep, glob, shell]

  - id: athene-resume
    display_name: "Athene: Resume"
    description: >-
      Pick up an Athene-tracked repo exactly where it left off: read .athene/state.md for current
      phase, decisions made, and open questions, then continue from there.
    invocation:
      mode: implicit
      use_when: starting a session on a repo that may already have Athene state in it
      skip_when: .athene/state.md doesn't exist (hands off to Athene: Audit instead)
    required_tools: [read_file, write_file, edit_file, grep, glob, shell]
